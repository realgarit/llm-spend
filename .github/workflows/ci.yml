name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Browser version must match the lockfile; no browser/APT download per job.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The pinned container already has the matching browser and OS libraries.
      - name: Verify preinstalled Chromium
        run: node -e "const fs=require('node:fs'); const p=require('playwright/package.json'); if(p.version!=='1.62.1') throw new Error('Update the pinned Playwright CI image to match the lockfile'); fs.accessSync(require('playwright').chromium.executablePath());"

      # E2E_SKIP_BUILD reuses the artifact the Build step above just produced —
      # tests/e2e/serve.mjs would otherwise run `npm run build` a second time.
      # It serves that build with the real standalone server and fails loudly if
      # .next/standalone is missing, so this stays honest if the steps are ever
      # reordered. Never `--update-snapshots` here: visual baselines are
      # recorded by hand (see tests/e2e/README.md).
      - name: Browser tests
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"
        timeout-minutes: 20

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
