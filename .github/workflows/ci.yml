name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      record_visual_baselines:
        description: Record Linux visual baselines for manual review
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Browser version must match the lockfile; no browser/APT download per job.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.record_visual_baselines && 'Record Linux baselines' || 'Build' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The pinned container already has the matching browser and OS libraries.
      - name: Verify preinstalled Chromium
        run: node -e "const fs=require('node:fs'); const p=require('playwright/package.json'); if(p.version!=='1.64.0') throw new Error('Update the pinned Playwright CI image to match the lockfile'); fs.accessSync(require('playwright').chromium.executablePath());"

      # E2E_SKIP_BUILD reuses the artifact the Build step above just produced —
      # tests/e2e/serve.mjs would otherwise run `npm run build` a second time.
      # It serves that build with the real standalone server and fails loudly if
      # .next/standalone is missing, so this stays honest if the steps are ever
      # reordered. Normal checks never record snapshots. The opt-in manual
      # recording below has a distinct check name and produces review artifacts.
      - name: Record Linux visual baselines for review
        if: github.event_name == 'workflow_dispatch' && inputs.record_visual_baselines
        run: npm run test:e2e:update -- visual.spec.ts
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload recorded visual baselines
        if: github.event_name == 'workflow_dispatch' && inputs.record_visual_baselines
        uses: actions/upload-artifact@v7
        with:
          name: linux-visual-baselines
          path: tests/e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7

      - name: Browser tests
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"
        timeout-minutes: 20

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
